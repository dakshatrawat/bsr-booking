<!-- Error Message -->
<p *ngIf="error" class="error">{{ error }}</p>
<div class="container">
  <!-- Room Type Selection -->
  <div class="field">
    <label for="search-room-type">Room type</label>
    <select id="search-room-type" class="select" [(ngModel)]="roomType" (ngModelChange)="onRoomTypeChange()">
      <option disabled value="">Choose a room type</option>
      <option *ngFor="let type of roomTypes" [value]="type">
        {{ type }}
      </option>
    </select>
  </div>

  <!-- Calendar Toggle Button -->
  <div #calendarField class="field calendar-field" [class.calendar-open]="showCalendar">
    <label for="search-dates">Dates</label>
    <button id="search-dates" type="button" class="calendar-toggle-btn" (click)="toggleCalendar()" [attr.aria-expanded]="showCalendar">
      <i class="fas fa-calendar" aria-hidden="true"></i> 
      {{ selectedDates.length ? selectedDates.length + (selectedDates.length === 1 ? ' date' : ' dates') + ' selected' : (showCalendar ? 'Hide calendar' : 'Choose dates') }}
    </button>

    <!-- Calendar Component -->
    <div *ngIf="showCalendar" class="calendar-wrapper">
      <app-calendar 
        [unavailableDates]="unavailableDates"
        (datesSelected)="onDatesSelected($event)">
      </app-calendar>
      <div *ngIf="selectedDates.length > 0" class="selected-dates-info">
        <p><strong>Selected Dates ({{ selectedDates.length }}):</strong></p>
        <p>{{ selectedDates.join(', ') }}</p>
      </div>
    </div>
  </div>

  <!-- Search Button -->
  <button type="button" (click)="handleSearch()">
    <i class="fas fa-search" aria-hidden="true"></i> Search
  </button>
</div>
