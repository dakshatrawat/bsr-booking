<div class="calendar-container">
  <div class="calendar-header">
    <button type="button" class="nav-button" (click)="previousMonth()" aria-label="Previous month">‹</button>
    <h3 class="month-year">{{ getMonthYearString() }}</h3>
    <button type="button" class="nav-button" (click)="nextMonth()" aria-label="Next month">›</button>
  </div>

  <div class="calendar-weekdays">
    <div class="weekday" *ngFor="let day of weekDays">{{ day }}</div>
  </div>

  <div class="calendar-grid">
    <div
      *ngFor="let date of daysInMonth"
      [class]="getDateClass(date)"
      (click)="toggleDate(date)"
      (keydown.enter)="toggleDate(date)"
      (keydown.space)="$event.preventDefault(); toggleDate(date)"
      role="button"
      [attr.tabindex]="isPastDate(date) || !isCurrentMonth(date) ? -1 : 0"
      [attr.aria-pressed]="isSelectedDate(date)"
      [attr.aria-disabled]="isPastDate(date) || isBookedDate(date) ? true : null"
      [attr.aria-label]="formatDate(date) + (isBookedDate(date) ? ', booked' : '')"
    >
      <span class="day-number">{{ date.getDate() }}</span>
    </div>
  </div>

  <div class="calendar-legend">
    <div class="legend-item">
      <span class="legend-color neutral"></span>
      <span>Available</span>
    </div>
    <div class="legend-item">
      <span class="legend-color booked"></span>
      <span>Booked</span>
    </div>
    <div class="legend-item">
      <span class="legend-color selected"></span>
      <span>Selected</span>
    </div>
  </div>
</div>
