<header class="navbar" [class.is-scrolled]="isScrolled">
  <div class="nav-container">
    <a routerLink="/home" class="brand" (click)="closeMenu()" aria-label="Bhagat Singh Resort, home">
      <span class="brand-mark" aria-hidden="true"><i class="fas fa-mountain"></i></span>
      <span class="brand-name">Bhagat Singh Resort</span>
    </a>

    <button
      type="button"
      class="theme-toggle"
      (click)="themeService.toggle()"
      [attr.aria-label]="themeService.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
      [title]="themeService.theme() === 'dark' ? 'Switch to light theme' : 'Switch to dark theme'"
    >
      <i class="fas" [class.fa-sun]="themeService.theme() === 'dark'" [class.fa-moon]="themeService.theme() !== 'dark'" aria-hidden="true"></i>
    </button>

    <button
      class="menu-toggle"
      type="button"
      (click)="toggleMenu()"
      [attr.aria-expanded]="isMenuOpen"
      aria-controls="primary-nav"
      [attr.aria-label]="isMenuOpen ? 'Close menu' : 'Open menu'"
    >
      <i class="fas" [class.fa-bars]="!isMenuOpen" [class.fa-xmark]="isMenuOpen" aria-hidden="true"></i>
    </button>

    <nav id="primary-nav" class="nav-panel" [class.is-open]="isMenuOpen" aria-label="Primary">
      <ul class="nav-links">
        <li><a routerLink="/home" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="closeMenu()">Home</a></li>
        <li><a routerLink="/rooms" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="closeMenu()">Rooms</a></li>
        <li><a routerLink="/find-booking" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="closeMenu()">Find a booking</a></li>
        <li><a routerLink="/about" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="closeMenu()">About</a></li>
        <li *ngIf="isAdmin"><a routerLink="/admin" routerLinkActive="is-active" ariaCurrentWhenActive="page" (click)="closeMenu()">Admin</a></li>
      </ul>

      <div class="nav-actions">
        <ng-container *ngIf="!isAuthemticated">
          <a routerLink="/login" class="btn btn-ghost" (click)="closeMenu()">Log in</a>
          <a routerLink="/register" class="btn btn-primary" (click)="closeMenu()">Create account</a>
        </ng-container>
        <ng-container *ngIf="isAuthemticated">
          <a *ngIf="isCustomer" routerLink="/profile" routerLinkActive="is-active" ariaCurrentWhenActive="page" class="btn btn-ghost" (click)="closeMenu()">
            <i class="fas fa-circle-user" aria-hidden="true"></i>
            <span>My account</span>
          </a>
          <button type="button" class="btn btn-secondary" (click)="handleLogout()">Log out</button>
        </ng-container>
      </div>
    </nav>
  </div>
</header>
