<div class="page page--narrow">
  <header class="page-header">
    <div class="page-header__text">
      <p class="page-header__eyebrow">
        <a routerLink="/admin"><i class="fas fa-arrow-left" aria-hidden="true"></i> Dashboard</a>
      </p>
      <h1>Add a user</h1>
      <p class="page-header__description">Create an account for a guest or a member of staff.</p>
    </div>
  </header>

  <form #userForm="ngForm" class="card" (ngSubmit)="handleSubmit(userForm)" novalidate>
    <div *ngIf="error" class="alert alert--danger" role="alert">
      <i class="fas fa-circle-exclamation" aria-hidden="true"></i>
      <div class="alert__body">{{ error }}</div>
    </div>

    <div class="form-grid form-grid--2">
      <div class="field">
        <label class="field__label" for="au-first">First name</label>
        <input id="au-first" class="input" type="text" name="firstName" autocomplete="off"
          [(ngModel)]="formData.firstName" #firstName="ngModel" required
          [class.is-invalid]="firstName.invalid && (firstName.touched || userForm.submitted)"
          [attr.aria-invalid]="firstName.invalid && (firstName.touched || userForm.submitted)"
          aria-describedby="au-first-error" />
        <span id="au-first-error" class="field__error" *ngIf="firstName.invalid && (firstName.touched || userForm.submitted)">
          <i class="fas fa-circle-exclamation" aria-hidden="true"></i> Enter a first name
        </span>
      </div>

      <div class="field">
        <label class="field__label" for="au-last">Last name</label>
        <input id="au-last" class="input" type="text" name="lastName" autocomplete="off"
          [(ngModel)]="formData.lastName" #lastName="ngModel" required
          [class.is-invalid]="lastName.invalid && (lastName.touched || userForm.submitted)"
          [attr.aria-invalid]="lastName.invalid && (lastName.touched || userForm.submitted)"
          aria-describedby="au-last-error" />
        <span id="au-last-error" class="field__error" *ngIf="lastName.invalid && (lastName.touched || userForm.submitted)">
          <i class="fas fa-circle-exclamation" aria-hidden="true"></i> Enter a last name
        </span>
      </div>

      <div class="field">
        <label class="field__label" for="au-email">Email</label>
        <input id="au-email" class="input" type="email" name="email" autocomplete="off" inputmode="email"
          [(ngModel)]="formData.email" #email="ngModel" required email
          [class.is-invalid]="email.invalid && (email.touched || userForm.submitted)"
          [attr.aria-invalid]="email.invalid && (email.touched || userForm.submitted)"
          aria-describedby="au-email-error" />
        <span id="au-email-error" class="field__error" *ngIf="email.invalid && (email.touched || userForm.submitted)">
          <i class="fas fa-circle-exclamation" aria-hidden="true"></i>
          {{ email.errors?.['required'] ? 'Enter an email address' : 'Enter a valid email, like name@example.com' }}
        </span>
      </div>

      <div class="field">
        <label class="field__label" for="au-phone">Phone number</label>
        <input id="au-phone" class="input" type="tel" name="phoneNumber" autocomplete="off" inputmode="tel"
          [(ngModel)]="formData.phoneNumber" #phone="ngModel" required
          [class.is-invalid]="phone.invalid && (phone.touched || userForm.submitted)"
          [attr.aria-invalid]="phone.invalid && (phone.touched || userForm.submitted)"
          aria-describedby="au-phone-error" />
        <span id="au-phone-error" class="field__error" *ngIf="phone.invalid && (phone.touched || userForm.submitted)">
          <i class="fas fa-circle-exclamation" aria-hidden="true"></i> Enter a phone number
        </span>
      </div>

      <div class="field">
        <label class="field__label" for="au-password">Temporary password</label>
        <div class="input-group">
          <input id="au-password" class="input" [type]="showPassword ? 'text' : 'password'" name="password"
            autocomplete="new-password" [(ngModel)]="formData.password" #password="ngModel" required
            [class.is-invalid]="password.invalid && (password.touched || userForm.submitted)"
            [attr.aria-invalid]="password.invalid && (password.touched || userForm.submitted)"
            aria-describedby="au-password-error" />
          <button type="button" class="input-group__action" (click)="showPassword = !showPassword" (mousedown)="$event.preventDefault()"
            [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'" [attr.aria-pressed]="showPassword"
            [title]="showPassword ? 'Hide password' : 'Show password'">
            <i class="fas" [class.fa-eye]="!showPassword" [class.fa-eye-slash]="showPassword" aria-hidden="true"></i>
          </button>
        </div>
        <span id="au-password-error" class="field__error" *ngIf="password.invalid && (password.touched || userForm.submitted)">
          <i class="fas fa-circle-exclamation" aria-hidden="true"></i> Choose a password
        </span>
      </div>

      <div class="field">
        <label class="field__label" for="au-role">Role</label>
        <select id="au-role" class="select" name="role" [(ngModel)]="formData.role" required>
          <option value="CUSTOMER">Guest</option>
          <option value="ADMIN">Admin</option>
        </select>
      </div>
    </div>

    <div class="form-actions">
      <a routerLink="/admin" class="btn btn-ghost">Cancel</a>
      <button type="submit" class="btn btn-primary" [class.is-loading]="submitting" [disabled]="submitting" [attr.aria-busy]="submitting">
        <span>Create user</span>
      </button>
    </div>
  </form>
</div>
