<!doctype html>
<html lang="en-IN">
<head>
  <meta charset="utf-8">
  <title>Bhagat Singh Resort · Rudraprayag</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <!-- Apply the saved (or OS) theme before first paint so there is no flash -->
  <script>
    (function () {
      var theme;
      try { theme = localStorage.getItem('bsr-theme'); } catch (e) {}
      if (theme !== 'light' && theme !== 'dark') {
        theme = window.matchMedia && window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
    })();
  </script>
  <meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#161A21" media="(prefers-color-scheme: dark)">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <!-- Only needed on the payment page; deferred so it never blocks first paint -->
  <script src="https://checkout.razorpay.com/v1/checkout.js" defer></script>
</head>
<body>
  <app-root></app-root>
</body>
</html>
